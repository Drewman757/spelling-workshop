<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#EEF3F9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Spelling"><title>Spelling Workshop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout concept: one narrow column built for a phone held by a kid. Letter tiles are the main object, digraphs (sh, th, ch, ea) get their own colour so the sound units show. */
:root{
  --bg:#EEF3F9; --surface:#FFFFFF; --ink:#16264A; --muted:#566789; --line:#CBD6E8;
  --tile:#FFCB47; --tile-edge:#D99A00; --tile-ink:#33260A;
  --sound:#27B0A3; --sound-edge:#15867B; --sound-ink:#032B27; --snd-text:#15867B;
  --action:#3556D8; --action-ink:#FFFFFF;
  --good:#1F8F52; --good-bg:#DDF3E6; --bad:#C8402F; --bad-bg:#FBE3DF; --info-bg:#FFF1CC;
  color-scheme:light;--display:'Fredoka',system-ui,sans-serif; --text:'Andika','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0E1730; --surface:#17234A; --ink:#EAF0FF; --muted:#A3B1D6; --line:#2B3A6B;
  --snd-text:#4FD6C8; --action:#8CA6FF; --action-ink:#0B1330;
  --good:#5FD08E; --good-bg:#123B2A; --bad:#FF8B7B; --bad-bg:#3F1D1D; --info-bg:#3A3112; color-scheme:dark}}
:root[data-theme="dark"]{
  color-scheme:dark;--bg:#0E1730; --surface:#17234A; --ink:#EAF0FF; --muted:#A3B1D6; --line:#2B3A6B;
  --snd-text:#4FD6C8; --action:#8CA6FF; --action-ink:#0B1330;
  --good:#5FD08E; --good-bg:#123B2A; --bad:#FF8B7B; --bad-bg:#3F1D1D; --info-bg:#3A3112; color-scheme:dark}

*{box-sizing:border-box}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:17px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:max(48px,env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--action);outline-offset:2px}
h1,h2{font-family:var(--display);font-weight:600;margin:0;text-wrap:balance}
h1{font-size:2.1rem;line-height:1.15}
h2{font-size:1.2rem}
.eyebrow{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.sub{color:var(--muted);margin:6px 0 0}
section{margin-top:26px}
.sn{color:var(--snd-text)}

/* word chips */
.words{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:1.2rem;font-weight:700}
.pips{display:flex;gap:3px}
.pip{width:9px;height:9px;border-radius:50%;background:var(--line)}
.pip.on{background:var(--good)}

/* activity cards */
.acts{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-top:12px}
.act{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}
.act b{display:block;font-size:1.1rem}
.act span{color:var(--muted);font-size:.92rem}
.act:active{transform:translateY(1px)}
.act.mix{grid-column:1/-1;background:var(--action);border-color:var(--action);color:var(--action-ink)}
.act.mix span{color:inherit;opacity:.9}
.foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;color:var(--muted);font-size:.9rem}
.link{background:none;border:0;padding:4px 0;color:var(--action);text-decoration:underline;font-size:.95rem}
.notice{background:var(--info-bg);border-radius:12px;padding:10px 14px;margin-top:16px;font-size:.92rem}

/* play */
.bar{display:flex;align-items:center;gap:12px}
.ghost{background:none;border:0;padding:8px 4px;font-size:1rem;font-weight:700;color:var(--muted)}
.track{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--good);border-radius:6px;transition:width .3s}
.cnt{font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.prompt{font-family:var(--display);font-size:1.35rem;margin:22px 0 4px;text-wrap:balance}
.hear{display:flex;align-items:center;gap:14px;margin:14px 0}
.speak{flex:none;width:68px;height:68px;border-radius:50%;border:0;background:var(--action);color:var(--action-ink);display:grid;place-items:center;border-bottom:5px solid rgba(0,0,0,.25)}
.speak:active{transform:translateY(2px);border-bottom-width:3px}
.speak svg{width:32px;height:32px}
.hearTxt{display:flex;flex-direction:column;gap:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:18px 0}
.tile,.slot{min-width:3.6rem;height:3.8rem;padding:0 12px;border-radius:14px;font-family:var(--text);font-size:2rem;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.tile{background:var(--tile);color:var(--tile-ink);border:0;border-bottom:5px solid var(--tile-edge)}
.tile.snd{background:var(--sound);color:var(--sound-ink);border-bottom-color:var(--sound-edge)}
.tile:active{transform:translateY(2px);border-bottom-width:3px}
.tile.gone{visibility:hidden}
.slot{border:3px dashed var(--line);background:transparent;color:var(--ink)}
.slot.filled{border:0;border-bottom:5px solid var(--tile-edge);background:var(--tile);color:var(--tile-ink)}
.slot.filled.snd{background:var(--sound);color:var(--sound-ink);border-bottom-color:var(--sound-edge)}
.slot.wrong{background:var(--bad-bg);color:var(--bad);border:3px solid var(--bad);animation:shake .4s}
.slot.right{background:var(--good-bg);color:var(--good);border:3px solid var(--good)}
.seg{font-size:3.2rem;font-weight:700;line-height:1;display:inline-block;min-width:1ch}
.seg.blank{border-bottom:5px dashed var(--muted);color:var(--muted);min-width:2.6rem;text-align:center}
.seg.fill{border-bottom:5px solid var(--good)}
.bigword{font-size:3.6rem;font-weight:700;text-align:center;margin:22px 0 10px;letter-spacing:.04em}
.showword{display:flex;justify-content:center;gap:2px;margin:22px 0 8px;flex-wrap:wrap}
.countdown{height:8px;border-radius:5px;background:var(--line);overflow:hidden;margin:8px auto 16px;max-width:320px}
.countdown i{display:block;height:100%;background:var(--tile-edge);animation:drain 4s linear forwards}
.ans{display:block;width:100%;font-family:var(--text);font-size:2.2rem;font-weight:700;text-align:center;letter-spacing:.05em;padding:12px;border:3px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);margin:16px 0 12px}
.btn{display:block;width:100%;font-size:1.15rem;font-weight:700;padding:14px 18px;border-radius:14px;border:0;background:var(--action);color:var(--action-ink);border-bottom:5px solid rgba(0,0,0,.25)}
.btn:active{transform:translateY(2px);border-bottom-width:3px}
.btn.quiet{background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.btns .btn{flex:1;min-width:140px}
.msg{border-radius:14px;padding:12px 14px;margin:14px 0 12px;font-size:1.05rem}
.msg.good{background:var(--good-bg);color:var(--good)}
.msg.bad{background:var(--bad-bg);color:var(--bad)}
.msg.info{background:var(--info-bg)}
.msg b{font-size:1.25rem}

/* done + edit */
.stars{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.star{width:30px;height:30px;border-radius:50%;background:var(--line)}
.star.on{background:var(--tile)}
textarea,.field{width:100%;font-family:var(--text);font-size:1.05rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:10px 12px}
textarea{min-height:240px;resize:vertical}
label{display:block;font-weight:700;margin:16px 0 6px}
.hint{color:var(--muted);font-size:.9rem;margin:6px 0 0}

/* slider */
.sl-tiles{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:26px 0 10px}
.sl-tiles .tile{transition:opacity .15s,transform .15s}
.sl-tiles .tile.off{opacity:.3}
.sl-tiles .tile.on{transform:translateY(-6px) scale(1.08);box-shadow:0 8px 0 -3px rgba(0,0,0,.12)}
.sl-label{text-align:center;min-height:3.2rem;font-size:1.15rem;color:var(--muted)}
.sl-label b{font-size:1.5rem;color:var(--ink)}
.sl-wrap{padding:8px 6px 0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:56px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:16px;border-radius:8px;background:var(--line)}
input[type=range]::-moz-range-track{height:16px;border-radius:8px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:52px;height:52px;border-radius:50%;background:var(--action);border:4px solid var(--surface);margin-top:-18px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
input[type=range]::-moz-range-thumb{width:44px;height:44px;border-radius:50%;background:var(--action);border:4px solid var(--surface)}
.sl-ends{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;margin-top:2px}
/* kids + lessons */
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;border-bottom:2px solid var(--line)}
.tab{font-family:var(--display);font-weight:600;font-size:1.15rem;padding:10px 18px;border:0;background:transparent;color:var(--muted);border-bottom:4px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--action)}
.tab.plus{font-size:1.4rem;padding:6px 16px}
select.field{appearance:auto;-webkit-appearance:menulist}
.chip.back{cursor:pointer}
/* sound library */
.libbox{background:var(--surface);border:2px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden}
.libbox .rrow:first-child{border-top:0}
.gl{font-size:1.5rem;font-weight:700;margin-right:6px}
.vsel{margin-top:6px;font-size:.9rem;padding:6px 8px}
/* hangman */
.balloons{display:block;width:100%;max-width:340px;margin:8px auto 0;height:auto}
.hword{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:12px 0 6px}
.hl{min-width:2.2rem;height:3.4rem;padding:0 2px;border-bottom:5px solid var(--ink);display:grid;place-items:end center;font-size:2.3rem;font-weight:700;line-height:1.2}
.hl.blank{border-bottom-color:var(--muted)}
.hl.miss{color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:16px 0 4px}
.key{height:50px;border-radius:10px;border:0;border-bottom:4px solid var(--tile-edge);background:var(--tile);color:var(--tile-ink);font-family:var(--text);font-size:1.3rem;font-weight:700;padding:0}
.key:active{transform:translateY(2px);border-bottom-width:2px}
.key.hit{background:var(--good-bg);color:var(--good);border-bottom-color:var(--good)}
.key.miss{background:var(--bad-bg);color:var(--bad);border-bottom-color:var(--bad);opacity:.75}
.key[disabled]{cursor:default;transform:none}
/* avatar */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.top>div{min-width:0}
.avatar{width:84px;height:84px;flex:none}
.avatar.sm{width:56px;height:56px;margin-left:auto}
.avatar .eyes,.avatar .mouth{transform-box:fill-box;transform-origin:center}
.avatar .eyes{animation:blink 5s infinite}
body.talking .avatar .mouth{animation:talk .26s ease-in-out infinite alternate}
.sl-av{display:flex;justify-content:center;margin-top:8px}
.sl-av .avatar{margin:0}
.dotrec{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px;animation:pulse 1s infinite}
.btn.rec{background:var(--bad);color:#fff;border-bottom-color:rgba(0,0,0,.3)}
.btn.sm[disabled]{opacity:.45}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
@keyframes talk{from{transform:scaleY(1)}to{transform:scale(1.2,4)}}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.avatar .eyes,body.talking .avatar .mouth,.dotrec{animation:none}}
/* voices */
.voices{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.vchip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:1rem}
.vchip[aria-pressed=true]{background:var(--action);color:var(--action-ink);border-color:var(--action)}
details.wd{background:var(--surface);border:2px solid var(--line);border-radius:14px;margin-top:10px}
details.wd summary{padding:12px 14px;font-weight:700;font-size:1.1rem;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
details.wd summary span{color:var(--muted);font-weight:400;font-size:.9rem}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:10px 14px;border-top:1px solid var(--line)}
.rl b{display:block;font-size:.75rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.rl span{overflow-wrap:anywhere}
.rl em{display:block;font-style:normal;font-size:.85rem;color:var(--muted)}
.rl em.mine{color:var(--good)}
.speak.sm{width:46px;height:46px;border-bottom-width:4px}
.speak.sm svg{width:22px;height:22px}
.btn.sm{width:auto;padding:9px 14px;font-size:.95rem;border-bottom-width:4px}
.row2{display:flex;gap:8px;margin-top:12px}
.row2 .field{flex:1;min-width:0}
.row2 .btn{width:auto}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes drain{from{width:100%}to{width:0}}
@media (prefers-reduced-motion:reduce){.slot.wrong{animation:none}.countdown i{animation:none;width:100%}.track i{transition:none}}
@media (max-width:380px){.tile,.slot{min-width:3.2rem;font-size:1.8rem}.bigword{font-size:3rem}}
</style></head><body>

<script>
(function(){

var DEFAULT_LIST={name:"This week's words",words:[

var AVATAR_SM=AVATAR.replace('class="avatar"','class="avatar sm"');
var SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';

/* ---------- storage ---------- */
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36)}
function today(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function okList(l){return !!(l&&Array.isArray(l.words)&&l.words.length)}
function mkLesson(name,words,date){return {id:uid('l'),date:date||today(),name:name,words:words}}
function mkKid(name){return {id:uid('k'),name:name,lessons:[],stats:{},view:{mode:'current'}}}
function cleanWords(ws){return (ws||[]).filter(function(x){return x&&x.w}).map(function(x){var o={w:String(x.w),s:x.s?String(x.s):''};if(x.h)o.h=true;return o})}
/* turns a saved file from any version into {kids,kid,voices,active} */
function migrate(raw){
 if(raw&&Array.isArray(raw.kids)&&raw.kids.length){
  raw.kids.forEach(function(k){k.id=k.id||uid('k');k.name=k.name||'Kid';k.stats=k.stats||{};k.view=k.view||{mode:'current'};
   k.lessons=(Array.isArray(k.lessons)?k.lessons:[]).map(function(l){return{id:l.id||uid('l'),date:l.date||today(),name:l.name||'Lesson',words:cleanWords(l.words)}}).filter(function(l){return l.words.length})});
  return{kids:raw.kids,kid:raw.kid,voices:Array.isArray(raw.voices)?raw.voices:[],active:raw.active||'computer',variants:(raw.variants&&typeof raw.variants==='object')?raw.variants:{}}}
 var o=mkKid('Oliver'),f=mkKid('Freddie');
 var ls=raw&&Array.isArray(raw.lists)?raw.lists.filter(okList):(raw&&okList(raw.list)?[raw.list]:[]);
 if(!ls.length)ls=[DEFAULT_LIST];
 ls.forEach(function(l){o.lessons.push(mkLesson(l.name||'My words',cleanWords(l.words)))});
 o.stats=(raw&&raw.stats)||{};
 return{kids:[o,f],kid:o.id,voices:raw&&Array.isArray(raw.voices)?raw.voices:[],active:raw&&raw.active||'computer',variants:{}}}
var store={kids:[],kid:null,voices:[],active:'computer',variants:{}};
(function(){var raw=null,m;try{raw=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 try{m=migrate(raw)}catch(e){m=migrate(null)}
 store.kids=m.kids;store.kid=m.kid;store.voices=m.voices;store.active=m.active;store.variants=m.variants||{}})();
if(!store.kids.some(function(k){return k.id===store.kid}))store.kid=store.kids[0].id;

function curKid(){return store.kids.find(function(k){return k.id===store.kid})||store.kids[0]}

  if(!seen[x.w]){seen[x.w]={w:x.w,s:x.s||''};out.push(seen[x.w])}else if(x.s&&!seen[x.w].s)seen[x.w].s=x.s})});return out}
function fmtDate(d){var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(d||'');if(!m)return d||'';var mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m[2]-1];return mo+' '+(+m[3])}

function activeList(){var k=curKid(),v=k.view||{mode:'current'};
 if(!k.lessons.length)return{name:'No words yet',words:[],mode:'none',lesson:null};
 if(v.mode==='all')return{name:'All lessons',words:allWords(k),mode:'all',lesson:null};
 var cl=curLesson(k),l=v.mode==='lesson'?k.lessons.find(function(x){return x.id===v.lid}):null;
 if(!l||l.id===cl.id)return{name:cl.name,words:visWords(cl),mode:'current',lesson:cl};

var el=new Audio(),seqId=0;
function talk(on){document.body.classList.toggle('talking',!!on)}
el.addEventListener('playing',function(){talk(true)});
['ended','pause','error','emptied'].forEach(function(n){el.addEventListener(n,function(){talk(false)})});
function speakText(t,rate){if(!hasSpeech||!t)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);
 if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=rate||0.85;u.onstart=function(){talk(true)};u.onend=u.onerror=function(){talk(false)};speechSynthesis.speak(u)}catch(e){}}
function stopAll(){seqId++;try{el.pause()}catch(e){}if(hasSpeech)try{speechSynthesis.cancel()}catch(e){}talk(false)}
var cust={};
function hashKey(t){var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)}
/* sound library: every grapheme has a key. Variant 0 is 'g:sh', later variants are 'g:th:1' */
var VARS={th:['th as in thin','th as in them'],ea:['ea as in eat','ea as in head'],oo:['oo as in moon','oo as in book'],ow:['ow as in cow','ow as in snow'],ou:['ou as in out','ou as in soup'],ie:['ie as in pie','ie as in field'],c:['c as in cat','c as in city'],g:['g as in go','g as in gem']};
function setOf(t){var o={};t.split(' ').forEach(function(x){o[x]=1});return o}
var TH_V=setOf('the them this that then than they these those there their mother father brother other another weather feather together rather bathe smooth breathe clothe either neither'),
 EA_S=setOf('head bread dead read ready heavy health healthy breath sweat sweater weather feather spread thread instead meant heaven leather measure treasure pleasant steady jealous ahead'),
 OO_S=setOf('book look good foot wood cook hood took stood shook hook brook wool crook rook nook'),
 OW_L=setOf('snow show grow blow slow low row know flow throw own glow bowl yellow window pillow follow blown grown shown tow mow crow arrow elbow shadow rainbow'),
 OU_S=setOf('soup you group youth route coupon through'),
 IE_L=setOf('field chief piece brief thief believe niece shield yield grief relief achieve fierce pierce priest'),
 G_HARD=setOf('get give girl gift begin together target anger finger geese gear giggle');
function autoVariant(w,c,i){
 if(c==='th')return TH_V[w]?1:0;
 if(c==='ea')return EA_S[w]?1:0;
 if(c==='oo')return OO_S[w]?1:0;
 if(c==='ow')return OW_L[w]?1:0;
 if(c==='ou')return OU_S[w]?1:0;
 if(c==='ie')return IE_L[w]?1:0;
 if(c==='c'||c==='g'){var pos=0,ch=chunks(w),j;for(j=0;j<i;j++)pos+=ch[j].length;var nx=w.charAt(pos+1);
  return (nx&&'eiy'.indexOf(nx)>-1&&!(c==='g'&&G_HARD[w]))?1:0}
 return 0}
function variantOf(w,i){var c=chunks(w)[i];if(!c||!VARS[c])return 0;var o=store.variants&&store.variants[w+'|'+i];return (o!=null&&o<VARS[c].length)?o:autoVariant(w,c,i)}
function libKey(c,v){return v?'g:'+c+':'+v:'g:'+c}
function soundKey(w,i){var c=chunks(w)[i];return c?libKey(c,variantOf(w,i)):null}
function parseKey(t){var m=/^g:([a-z]+)(?::(\d+))?$/.exec(t);return m?{c:m[1],v:+(m[2]||0)}:null}
function chunkOfKey(t){var p=parseKey(t);return p?p.c:null}
var ALIAS={'g:tch':'g:ch','g:dge':'g:j','g:kn':'g:n','g:wr':'g:r','g:qu':'g:q','g:au':'g:aw','g:ie':'g:igh','g:ie:1':'g:ee','g:ou:1':'g:oo','g:c:1':'g:s','g:g:1':'g:j'};

 if(v&&v!=='computer'&&(u=cust[v+'|'+t]))return u;
 if(t.slice(0,2)==='g:'){for(var i=0;i<store.voices.length;i++){u=cust[store.voices[i].id+'|'+t];if(u)return u}}

function say(t,rate){playSeq([t],rate)}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function chunks(w){var out=[],i=0;while(i<w.length){var three=w.slice(i,i+3),two=w.slice(i,i+2);if(CH3.indexOf(three)>-1){out.push(three);i+=3}else if(CH.indexOf(two)>-1){out.push(two);i+=2}else{out.push(w[i]);i++}}return out}
function chunkHTML(w){return chunks(w).map(function(c){return c.length>1?'<span class="sn">'+esc(c)+'</span>':esc(c)}).join('')}
function grp(c){return GROUPS.find(function(g){return g.indexOf(c)>-1})||[]}
function distractors(ch,n){var out=[];
 ch.forEach(function(c){if(c.length>1&&out.length<n){var alt=shuffle(grp(c).filter(function(x){return x!==c&&ch.indexOf(x)<0&&out.indexOf(x)<0}));if(alt.length)out.push(alt[0])}});

function clean(s){return s.toLowerCase().replace(/[^a-z']/g,'')}
function parseList(txt){var seen={},out=[];
 txt.split(/\n/).forEach(function(line){line=line.trim();if(!line)return;
  if(line.indexOf('|')>-1){var p=line.split('|');var w=clean(p.shift());if(w&&!seen[w]){seen[w]=1;out.push({w:w,s:p.join('|').trim()})}}

 return out.slice(0,40)}

var ui={addKid:false};

function viewRow(){
 var k=curKid();if(k.lessons.length<2)return '';var cl=curLesson(k),v=k.view||{mode:'current'};
 var val=v.mode==='all'?'all':(v.mode==='lesson'&&v.lid!==cl.id&&k.lessons.some(function(l){return l.id===v.lid})?'L:'+v.lid:'current');
 var past=k.lessons.filter(function(l){return l!==cl}).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0});

 return '<section aria-label="Voice"><div class="voices"><span class="eyebrow">Voice</span>'+chips+'</div></section>'}
function homeHTML(){

   '<div class="btns" style="margin-top:22px"><button class="btn" data-a="newlesson">Add words for '+esc(k.name)+'</button></div>'+
   '<div class="foot"><button class="link" data-a="rec">Record voices</button><button class="link" data-a="lib">Sound library</button></div>'}
 var chips=ws.map(function(x){var s=st(x.w).streak,pips='';for(var i=0;i<3;i++)pips+='<i class="pip'+(i<s?' on':'')+'"></i>';

  '<p class="sub">'+solid+' of '+n+' words solid. Three right in a row makes a word solid.</p></div>'+AVATAR+'</header>'+viewRow()+
  (hasSpeech||!ws.some(function(x){return !AUDIO[x.w]})?'':'<div class="notice">This device cannot read words out loud. Look, cover, write and Unscramble still work.</div>')+
  voiceRow()+'<section aria-label="Words"><h2>The words</h2><div class="words">'+chips+'</div><p class="hint">Tap a word to hear it. Teal letters are one sound.</p></section>'+
  '<section aria-label="Activities"><h2>Practice</h2><div class="acts">'+

  '<div class="foot"><button class="link" data-a="newlesson">Add a new lesson</button>'+(al.lesson?'<button class="link" data-a="edit">Edit this lesson</button>':'')+'<button class="link" data-a="rec">Record voices</button><button class="link" data-a="lib">Sound library</button><span>Progress stays on this device.</span></div>'}

function hearRow(c){return '<div class="hear"><button class="speak" data-a="say" aria-label="Hear the word">'+SPK+'</button><div class="hearTxt"><b>Hear the word</b>'+
 (c.wd.s?'<button class="link" data-a="sent">Hear it in a sentence</button>':'')+'</div>'+AVATAR_SM+'</div>'}

function resultHTML(c){
 var last=run.n>=run.total;var nextBtn='<button class="btn next" data-a="next">'+(last?'See results':'Next word')+'</button>';
 if(c.state==='right')return '<div class="msg good" role="status"><b>'+chunkHTML(c.w)+'</b> is right.'+(c.misses?' Good job sticking with it.':'')+'</div>'+nextBtn;
 if(c.state==='reveal')return '<div class="msg info" role="status">The word is <b>'+chunkHTML(c.w)+'</b>. Say it out loud once. It will come back so you get another try.</div>'+nextBtn;
 if(c.msg)return '<div class="msg bad" role="status">'+c.msg+'</div>';

function tilesBody(c){
 var wrong=c.state==='wrong',right=c.state==='right';
 var slots=c.units.map(function(u,i){var p=c.placed[i];
  if(p===undefined)return '<span class="slot"></span>';
  var cls='slot filled'+(p.t.length>1?' snd':'')+(wrong?' wrong':'')+(right?' right':'');
  return '<button class="'+cls+'" data-a="slot" data-i="'+i+'" aria-label="Remove '+esc(p.t)+'">'+esc(p.t)+'</button>'}).join('');
 var tiles=c.tiles.map(function(t,k){return '<button class="tile'+(t.t.length>1?' snd':'')+(t.used?' gone':'')+'" data-a="tile" data-k="'+k+'"'+(t.used?' tabindex="-1" aria-hidden="true"':'')+'>'+esc(t.t)+'</button>'}).join('');
 var showTiles=c.state==='ask'||c.state==='wrong';
 return '<div class="row" aria-label="Your word">'+slots+'</div>'+
  (showTiles?'<div class="row">'+tiles+'</div>'+(c.placed.length&&c.state==='ask'?'<div class="btns"><button class="btn quiet" data-a="undo">Undo</button></div>':''):'')}

function inputBody(c){
 if(c.state!=='ask')return '';
 return '<input id="ans" class="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Type the word">'+
  '<button class="btn" data-a="check">Check</button>'}

function missingBody(c){
 var done=c.state==='right'||c.state==='reveal';
 var segs=c.ch.map(function(x,i){
  if(i===c.bi)return done?'<span class="seg sn fill">'+esc(x)+'</span>':'<span class="seg blank">?</span>';
  return '<span class="seg'+(x.length>1?' sn':'')+'">'+esc(x)+'</span>'}).join('');
 var opts=c.state==='ask'?'<div class="row">'+c.opts.map(function(o,k){
  return '<button class="tile'+(o.t.length>1?' snd':'')+'" data-a="opt" data-k="'+k+'"'+(o.off?' disabled style="opacity:.35"':'')+'>'+esc(o.t)+'</button>'}).join('')+'</div>':'';
 return '<div class="showword" aria-label="Word with a missing sound">'+segs+'</div>'+opts}

function slideBody(c){
 var n=c.ch.length;
 var tiles=c.ch.map(function(x,i){return '<button class="tile'+(x.length>1?' snd':'')+' off" data-a="stile" data-i="'+i+'" id="st'+i+'">'+esc(x)+'</button>'}).join('');
 return '<div class="sl-av">'+AVATAR+'</div><div class="prompt">Slide across the word. Hear every sound, then the whole word.</div>'+
  '<div class="sl-tiles" aria-label="Sounds in the word">'+tiles+'</div>'+
  '<div class="sl-label" id="sl-label" aria-live="polite">Slide the circle to start.</div>'+
  '<div class="sl-wrap"><input id="sl" type="range" min="0" max="'+(n+1)+'" step="1" value="0" aria-label="Slide through the sounds"><div class="sl-ends"><span>start</span><span>whole word</span></div></div>'+
  '<div class="btns" style="margin-top:22px"><button class="btn quiet" data-a="sayw">Hear the word</button></div>'}
function setSlide(v){
 var c=run&&run.cur;if(!c||c.act!=='slide')return;var n=c.ch.length;c.pos=v;if(v>c.max)c.max=v;
 for(var i=0;i<n;i++){var t=document.getElementById('st'+i);if(t)t.className='tile'+(c.ch[i].length>1?' snd':'')+((v===n+1||v===i+1)?' on':' off')}
 var lab=document.getElementById('sl-label');
 if(v===0){lab.innerHTML='Slide the circle to start.';return}
 if(v===n+1){lab.innerHTML='Say it fast: <b>'+chunkHTML(c.w)+'</b>';say(c.w);return}
 lab.innerHTML='Sound '+v+' of '+n+': <b>'+(c.ch[v-1].length>1?'<span class="sn">'+esc(c.ch[v-1])+'</span>':esc(c.ch[v-1]))+'</b>';
 say(soundKey(c.w,v-1))}
function hangBody(c){
 var left=6-c.wrong,cols=['#E8505B','#FFB830','#27B0A3','#3556D8','#B65BD8','#46B86A'],b='',i;
 for(i=0;i<6;i++){var x=25+i*50;
  if(i<left)b+='<path d="M'+x+' 52Q'+(x+(i<3?10:-10))+' 72 150 88" fill="none" stroke="var(--muted)" stroke-width="1.5"/><ellipse cx="'+x+'" cy="30" rx="17" ry="21" fill="'+cols[i]+'" stroke="rgba(0,0,0,.25)" stroke-width="1.5"/><ellipse cx="'+(x-6)+'" cy="22" rx="4" ry="6" fill="#fff" opacity=".45"/>';
  else b+='<path d="M'+(x-11)+' 40l6-10 5 7 5-10 7 11" fill="none" stroke="var(--muted)" stroke-width="2" stroke-dasharray="3 3" opacity=".7"/>'}
 var done=c.state!=='ask';
 var slots=c.w.split('').map(function(ch){if(!/[a-z]/.test(ch))return '<span class="hl">'+esc(ch)+'</span>';
  var hit=c.guessed.indexOf(ch)>-1,show=hit||done;return '<span class="hl'+(show?'':' blank')+((done&&!hit)?' miss':'')+'">'+(show?esc(ch):'')+'</span>'}).join('');
 var keys='abcdefghijklmnopqrstuvwxyz'.split('').map(function(l){var g=c.guessed.indexOf(l)>-1,hit=g&&c.w.indexOf(l)>-1;
  return '<button class="key'+(g?(hit?' hit':' miss'):'')+'" data-a="hg" data-l="'+l+'"'+(g?' disabled':'')+'>'+l+'</button>'}).join('');
 return '<div class="prompt">Guess the letters. Each wrong letter pops a balloon.</div>'+hearRow(c)+
  '<svg class="balloons" viewBox="0 0 300 92" role="img" aria-label="'+left+' of 6 balloons left">'+b+'</svg>'+
  '<div class="hword" aria-label="The word">'+slots+'</div>'+(done?'':'<div class="keys">'+keys+'</div>')}
function hangGuess(l){var c=run&&run.cur;if(!c||c.act!=='hang'||c.state!=='ask'||c.guessed.indexOf(l)>-1)return;
 c.guessed.push(l);if(c.w.indexOf(l)<0)c.wrong++;keepScroll=true;
 var won=c.w.replace(/[^a-z]/g,'').split('').every(function(x){return c.guessed.indexOf(x)>-1});
 if(won){var s2=st(c.w);s2.ok++;if(c.wrong<=2){s2.streak++;run.stars++}save();run.won=(run.won||0)+1;c.state='right';say(c.w);render();return}
 if(c.wrong>=6){recordMiss(c);c.state='reveal';say(c.w);render();return}
 say('g:'+l);render()}
function playHTML(){
 var c=run.cur,pct=Math.round((run.n-1+(c.state==='right'||c.state==='reveal'?1:0))/run.total*100);
 var head='<div class="bar"><button class="ghost" data-a="home">&lsaquo; Back</button><div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div><span class="cnt">'+run.n+' / '+run.total+'</span></div>';
 var body='';
 if(c.act==='slide')return head+slideBody(c)+'<button class="btn next" data-a="next" style="margin-top:14px">'+(run.n>=run.total?'See results':'Next word')+'</button>';
 if(c.act==='hang')return head+hangBody(c)+resultHTML(c);
 if(c.act==='build')body='<div class="prompt">Listen, then build the word with the sound tiles.</div>'+hearRow(c)+tilesBody(c);
 else if(c.act==='scramble')body='<div class="prompt">Put the letters in order to spell the word.</div>'+hearRow(c)+tilesBody(c);
 else if(c.act==='type')body='<div class="prompt">Listen, then type the word.</div>'+hearRow(c)+inputBody(c);
 else if(c.act==='missing')body='<div class="prompt">Which sound finishes the word?</div>'+hearRow(c)+missingBody(c);
 else if(c.act==='lcw'){
  if(c.state==='ask'&&c.phase==='look')body='<div class="prompt">Look at the word. Get it in your head.</div><div class="bigword">'+chunkHTML(c.w)+'</div><div class="countdown"><i></i></div><button class="btn" data-a="cover">Cover it</button>';
  else body='<div class="prompt">'+(c.state==='ask'?'Now write it from memory.':'Look, cover, write')+'</div>'+hearRow(c)+inputBody(c)}
 return head+body+resultHTML(c)}

function doneHTML(){
 if(run.act==='hang')return '<header><div class="eyebrow">Round finished</div><h1>You solved '+run.won+' of '+run.total+' words</h1><p class="sub">'+(run.missed.length?'The ones that popped all the balloons will come back soon.':'Not one word got away.')+'</p></header>'+
  (run.missed.length?'<section><h2>Practice these again</h2><div class="words">'+run.missed.map(function(w){return '<button class="chip" data-a="hear" data-w="'+esc(w)+'">'+chunkHTML(w)+'</button>'}).join('')+'</div></section>':'')+
  '<div class="btns" style="margin-top:26px"><button class="btn" data-a="again">Play again</button><button class="btn quiet" data-a="home">Home</button></div>';
 if(run.act==='slide')return '<header><div class="eyebrow">All done</div><h1>You slid through '+run.total+' words</h1><p class="sub">Now try Build it or Missing sound and use what you heard.</p></header><div class="btns" style="margin-top:26px"><button class="btn" data-a="again">Slide again</button><button class="btn quiet" data-a="home">Home</button></div>';
 var s=run.stars,t=run.total,stars='';for(var i=0;i<t;i++)stars+='<i class="star'+(i<s?' on':'')+'"></i>';
 var msg=s>=9?'Super spelling.':s>=6?'Strong round.':'Good practice. The tricky ones will keep coming back until they stick.';
 var miss=run.missed.length?'<section><h2>Practice these again</h2><div class="words">'+run.missed.map(function(w){return '<button class="chip" data-a="hear" data-w="'+esc(w)+'">'+chunkHTML(w)+'</button>'}).join('')+'</div></section>':'';
 return '<header><div class="eyebrow">Round finished</div><h1>'+s+' of '+t+' on the first try</h1><p class="sub">'+msg+'</p></header>'+
  '<div class="stars" aria-hidden="true">'+stars+'</div>'+miss+
  '<div class="btns" style="margin-top:26px"><button class="btn" data-a="again">Play again</button><button class="btn quiet" data-a="home">Home</button></div>'}

var recMsg='',RS={key:null};

function itemsFor(wd){var out=[{k:wd.w,label:'The word',sub:wd.w}],seen={};if(wd.s)out.push({k:wd.s,label:'The sentence',sub:wd.s});

  out.push({k:k,label:'Sound',sub:c,vs:VARS[c]?{w:wd.w,i:i,v:variantOf(wd.w,i),opts:VARS[c]}:null})});return out}

function recHTML(){
 var vid=store.active,can=vid!=='computer',busy=!!RS.key;

 var h='<div class="bar"><button class="ghost" data-a="home">&lsaquo; Back</button></div><header class="top" style="margin-top:10px"><div><div class="eyebrow">Spelling Workshop</div><h1>Record voices</h1>'+

  '<section><h2>Whose voice?</h2><div class="voices">'+chips+'</div>'+

 if(recMsg)h+='<div class="msg info" role="status">'+esc(recMsg)+'</div>';
 if(!can)h+='<p class="hint" style="margin-top:18px">Add a name or pick one above, then the words show up here.</p>';
 else{
  h+='<section><h2>Words for '+esc(voiceName(vid))+'</h2><p class="hint">Tap a word to open it. Record the word, the sentence and each sound. Say sounds short, like "sh" and not "shuh".</p>';
  store.list.words.forEach(function(wd,wi){var it=itemsFor(wd),have=it.filter(function(x){return cust[vid+'|'+x.k]}).length;
   h+='<details class="wd" data-wi="'+wi+'"><summary><b>'+esc(wd.w)+'</b><span>'+have+' of '+it.length+' recorded</span></summary>'+
    it.map(function(x){var mine=!!cust[vid+'|'+x.k],me=RS.key===x.k;
     return '<div class="rrow"><div class="rl"><b>'+x.label+'</b><span>'+esc(x.sub)+'</span>'+vsel(x)+'<em class="'+(mine?'mine':'')+'">'+(me?'<i class="dotrec"></i>Recording. Say it now.':(mine?'Your recording':'Avatar voice'))+'</em>'+(mine&&!me?'<button class="link" data-a="delrec" data-k="'+esc(x.k)+'">Remove</button>':'')+'</div>'+
      '<button class="speak sm" data-a="playk" data-k="'+esc(x.k)+'" aria-label="Play"'+(busy?' disabled':'')+'>'+SPK+'</button>'+
      (me?'<button class="btn rec sm" data-a="stoprec">Stop</button>':'<button class="btn quiet sm" data-a="recfor" data-k="'+esc(x.k)+'"'+(busy?' disabled':'')+'>'+(mine?'Replace':'Record')+'</button>')+'</div>'}).join('')+'</details>'});
  h+='</section>'}
 h+='<section><button class="link" data-a="lib">Open the sound library</button></section>';
 h+='<section><h2>Backup</h2><p class="hint">Recordings live on this phone. Save a backup file to keep them safe or to move them to another device.</p><div class="btns"><button class="btn quiet" data-a="export">Save backup file</button><button class="btn quiet" data-a="import">Load backup file</button></div></section>';
 return h}

var LIB=[],libOnly=false;

function captureEdit(){var t=document.getElementById('wl'),n=document.getElementById('ln'),d=document.getElementById('ld');if(t)edit.draft=t.value;if(n)edit.name=n.value;if(d&&d.value)edit.date=d.value}
function runOcr(file){captureEdit();ocrBusy=true;ocrMsg='Reading the picture. The first time takes a little while.';render();
 prepImage(file).then(function(c){return(window.Tesseract?Promise.resolve():loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js')).then(function(){return Tesseract.createWorker('eng',1,{langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/eng@1.0.0/4.0.0_best_int'})}).then(function(wk){return wk.setParameters({tessedit_pageseg_mode:'6'}).then(function(){return wk.recognize(c)}).then(function(r){try{wk.terminate()}catch(e){}return r},function(e){try{wk.terminate()}catch(x){}throw e})})})
 .then(function(r){var words=ocrWords(r.data);ocrBusy=false;
  if(!words.length){ocrMsg='I could not find words in that picture. Try a closer, straighter photo, or type them in.';render();return}
  var base=edit.draft!=null?edit.draft:(edit.isNew?'':wordsText((lessonById(edit.lid)||{words:[]}).words));
  edit.draft=(base.trim()?base.replace(/\s+$/,'')+'\n':'')+words.join('\n');
  ocrMsg='Found '+words.length+' words. Check them, delete anything that is not a spelling word, then tap Save words.';render()})
 .catch(function(){ocrBusy=false;ocrMsg='Could not read the picture. You need an internet connection the first time. You can type the words instead.';render()})}

var fileBackup=document.createElement('input');fileBackup.type='file';fileBackup.accept='application/json,.json';fileBackup.style.display='none';document.body.appendChild(fileBackup);
fileBackup.addEventListener('change',function(){var f=fileBackup.files&&fileBackup.files[0];fileBackup.value='';importFile(f)});
var fileImg=document.createElement('input');fileImg.type='file';fileImg.accept='image/*';fileImg.style.display='none';document.body.appendChild(fileImg);
fileImg.addEventListener('change',function(){var f=fileImg.files&&fileImg.files[0];fileImg.value='';if(f)runOcr(f)});
idbOpen(function(){if(idb)idbAll(function(all){
 Object.keys(all).forEach(function(k){var m=/^([^|]+)\|s:(.+):(\d+)$/.exec(k);if(!m)return;var sk=soundKey(m[2],+m[3]);
  if(sk){var nk=m[1]+'|'+sk;if(!all[nk]){all[nk]=all[k];idbPut(nk,all[k])}}idbDel(k);delete all[k]});
 Object.keys(all).forEach(function(k){try{cust[k]=URL.createObjectURL(all[k])}catch(e){}});refresh()})});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

/* ---------- events ---------- */
var H={
 hg:function(b){hangGuess(b.dataset.l)},
 rec:function(){view='rec';recMsg='';render()},
 lib:function(){view='lib';recMsg='';render()},
 libf:function(b){libOnly=b.dataset.f==='used';render()},
 usev:function(b){if(RS.key)return;store.active=b.dataset.v;save();render()},
 addv:function(){var el2=document.getElementById('nv'),n=(el2&&el2.value||'').trim();if(!n){recMsg='Type a name first.';render();return}
  var v={id:'v'+Date.now().toString(36)+Math.floor(Math.random()*1000).toString(36),name:n.slice(0,20)};store.voices.push(v);store.active=v.id;recMsg='';saveVoices();render()},
 playk:function(b){say(b.dataset.k)},
 recfor:function(b){startRec(b.dataset.k)},
 stoprec:function(){stopRec()},
 delrec:function(b){var ck=store.active+'|'+b.dataset.k,u=cust[ck];if(u&&u.indexOf('blob:')===0)try{URL.revokeObjectURL(u)}catch(e){}delete cust[ck];idbDel(ck);recMsg='Removed.';render()},
 export:function(){exportAll()},
 import:function(){fileBackup.click()},
 usekid:function(b){if(b.dataset.id===store.kid)return;store.kid=b.dataset.id;ui.addKid=false;save();render()},
 addkid:function(){ui.addKid=true;render()},
 cancelkid:function(){ui.addKid=false;render()},
 savekid:function(){var el2=document.getElementById('nk'),n=(el2&&el2.value||'').trim();if(!n)return;
  if(store.kids.some(function(k){return k.name.toLowerCase()===n.toLowerCase()})){el2.value='';el2.placeholder='That name is already a tab';return}
  var k=mkKid(n.slice(0,20));store.kids.push(k);store.kid=k.id;ui.addKid=false;save();render()},
 ocr:function(){captureEdit();fileImg.click()},
 newlesson:function(){view='edit';edit={err:'',confirm:false,draft:'',name:'',date:today(),isNew:true};ocrMsg='';render()},
 unhide:function(b){captureEdit();var L=lessonById(edit.lid);if(!L)return;var x=L.words.find(function(y){return y.w===b.dataset.w});if(!x)return;
  x.h=false;delete x.h;edit.draft=(edit.draft||'').replace(/\s+$/,'')+(edit.draft&&edit.draft.trim()?'\n':'')+(x.s?x.w+' | '+x.s:x.w);save();render()},

 home:function(){clearTimers();if(RS.mr)stopRec();view='home';run=null;edit={err:'',confirm:false};ocrMsg='';render()},
 start:function(b){if(!store.list.words.length)return;startRun(b.dataset.act)},
 again:function(){startRun(run.act)},
 hear:function(b){say(b.dataset.w)},
 say:function(){say(run.cur.w)},
 sent:function(){say(run.cur.wd.s,0.9)},
 next:function(){next()},
 tile:function(b){var c=run.cur;if(c.state!=='ask')return;var k=+b.dataset.k,t=c.tiles[k];
  if(t.used||c.placed.length>=c.units.length)return;t.used=true;c.placed.push({t:t.t,k:k});
  if(c.placed.length===c.units.length){
   if(c.placed.map(function(p){return p.t}).join('')===c.w){good(c);return}
   c.state='wrong';render();var cc=c;clearTimeout(wrongTimer);
   wrongTimer=setTimeout(function(){if(run&&run.cur===cc&&cc.state==='wrong')afterMiss(cc)},900);return}
  render()},
 slot:function(b){var c=run.cur;if(c.state!=='ask')return;
  c.placed.splice(+b.dataset.i).forEach(function(p){c.tiles[p.k].used=false});render()},
 undo:function(){var c=run.cur;if(c.state!=='ask'||!c.placed.length)return;var p=c.placed.pop();c.tiles[p.k].used=false;render()},
 opt:function(b){var c=run.cur;if(c.state!=='ask')return;var o=c.opts[+b.dataset.k];if(o.off)return;
  if(o.t===c.ans){good(c);return}
  o.off=true;recordMiss(c);
  if(c.misses>=2)c.state='reveal';else c.msg='Not quite. Listen again and try another sound.';
  say(c.w);render()},
 stile:function(b){var c=run.cur,i=+b.dataset.i;var sl=document.getElementById('sl');if(sl)sl.value=i+1;setSlide(i+1)},
 sayw:function(){say(run.cur.w)},
 cover:function(){var c=run.cur;clearTimeout(timer);c.phase='write';render()},
 check:function(){var c=run.cur;if(!c||c.state!=='ask')return;var el=document.getElementById('ans');if(!el)return;
  var v=(el.value||'').trim().toLowerCase();if(!v)return;
  if(v===c.w){good(c);return}
  recordMiss(c);
  if(c.misses>=2){c.state='reveal'}
  else if(c.act==='lcw'){c.msg='Not quite. Look at the word one more time.';startLook(c)}
  else{c.msg='Not quite. Listen again and try once more.';say(c.w)}
  render()},
 edit:function(){var l=store.list.lesson;if(!l)return;view='edit';edit={err:'',confirm:false,isNew:false,lid:l.id};ocrMsg='';render()},
 saveList:function(){captureEdit();var words=parseList(edit.draft||'');
  if(!words.length){edit.err='Add at least one word.';render();return}
  var k=curKid(),date=/^\d{4}-\d{2}-\d{2}$/.test(edit.date||'')?edit.date:today(),name=(edit.name||'').trim()||('Lesson of '+fmtDate(date));
  if(edit.isNew){var nl=mkLesson(name,words,date);k.lessons.push(nl);k.view=(curLesson(k)===nl)?{mode:'current'}:{mode:'lesson',lid:nl.id}}
  else{var L=lessonById(edit.lid);if(L){var map={};words.forEach(function(x){map[x.w]=x});
    var kept=L.words.map(function(o){var m=map[o.w];if(m){var r={w:o.w,s:m.s||''};return r}var r2={w:o.w,s:o.s||'',h:true};return r2});
    words.forEach(function(x){if(!L.words.some(function(o){return o.w===x.w}))kept.push({w:x.w,s:x.s||''})});
    var order={};words.forEach(function(x,i){order[x.w]=i});
    kept.sort(function(a,b){var ha=a.h?1:0,hb=b.h?1:0;if(ha!==hb)return ha-hb;return ha?0:order[a.w]-order[b.w]});
    L.words=kept;L.name=name;L.date=date}}
  save();edit={err:'',confirm:false};ocrMsg='';view='home';render()},
 resetProg:function(){captureEdit();if(!edit.confirm){edit.confirm=true;render();return}
  store.stats={};save();edit={err:'',confirm:false};view='home';render()}
};
app.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;var f=H[b.dataset.a];if(f)f(b)});

 if(t.classList&&t.classList.contains('vsel')){store.variants[t.dataset.w+'|'+t.dataset.i]=+t.value;save();render();return}
 if(e.target.id!=='viewsel')return;var v=e.target.value,k=curKid();
 k.view=v==='all'?{mode:'all'}:v.slice(0,2)==='L:'?{mode:'lesson',lid:v.slice(2)}:{mode:'current'};save();render()});
app.addEventListener('input',function(e){if(e.target.id==='sl')setSlide(+e.target.value)});

app.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();H.check()}});

render();
})();
